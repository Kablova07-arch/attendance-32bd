name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build APK
      uses: flet-dev/flet-build-action@v1
      env:
        PYTHONUTF8: 1
        FLET_CLI_NO_RICH_OUTPUT: 1
      with:
        target: apk
        runner-python-version: "3.12"
        bundled-python-version: "3.12"
        # Передаём дополнительные аргументы в flet build
        extra-args: '--project "app32bd" --product "32-бд" --android-extract-packages flet'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/apk
        if-no-files-found: error
