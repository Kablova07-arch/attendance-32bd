name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Flet
      run: |
        python -m pip install --upgrade pip
        pip install "flet[all]"
        pip install flet-cli

    - name: Build APK
      env:
        PYTHONUTF8: 1
        FLET_CLI_NO_RICH_OUTPUT: 1
      run: |
        flet build apk --project "app32bd" --product "32-бд" --python-version 3.12 --yes

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/apk
        if-no-files-found: error
